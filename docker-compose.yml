services:
  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379
    volumes:
      - ./valkey_storage:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_storage:/qdrant/storage

  pg:
    image: docker.io/postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opencontext-db
    volumes:
      - ./pg_storage:/var/lib/postgresql/data
